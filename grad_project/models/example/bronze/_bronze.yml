version: 2

models:
  # ----------------------------------------------------------------------
  - name: bronze_daily_chokepoints
    description: >
      Daily vessel transits and capacity per chokepoint. Built from
      staging.portwatch_daily_chokepoints by keeping only the latest version of each
      (date, portid) and converting text to proper types. Original column names are kept.
      Grain: one row per date and chokepoint.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['[date]', portid]
      - dbt_utils.expression_is_true:
          name: assert_daily_counts_not_negative
          arguments:
            expression: "n_total >= 0 and n_cargo >= 0 and n_tanker >= 0 and capacity >= 0"
          config:
            severity: warn
      - dbt_utils.expression_is_true:
          name: assert_daily_total_is_cargo_plus_tanker
          arguments:
            expression: "n_total = n_cargo + n_tanker"
          config:
            severity: warn
    columns:
      - name: date
        description: "Transit date, converted from text YYYY/MM/DD to DATE."
        data_tests: [not_null]
      - name: year
        description: "Year part of the date."
      - name: month
        description: "Month part of the date (1-12)."
      - name: day
        description: "Day of the month."
      - name: portid
        description: "Chokepoint identifier (e.g. chokepoint1). Joins to bronze_chokepoints.portid."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('bronze_chokepoints')
                field: portid
      - name: portname
        description: "Chokepoint name (e.g. Suez Canal)."
      - name: n_container
        description: "Number of container ships that transited."
      - name: n_dry_bulk
        description: "Number of dry bulk carriers that transited."
      - name: n_general_cargo
        description: "Number of general cargo ships that transited."
      - name: n_roro
        description: "Number of roll-on/roll-off (RoRo) vessels that transited."
      - name: n_tanker
        description: "Number of tankers that transited."
      - name: n_cargo
        description: "Number of cargo vessels (container + dry bulk + general cargo + RoRo, tankers excluded)."
      - name: n_total
        description: "Total number of vessels (n_cargo + n_tanker)."
      - name: capacity_container
        description: "Estimated capacity of the container ships (metric tons)."
      - name: capacity_dry_bulk
        description: "Estimated capacity of the dry bulk carriers (metric tons)."
      - name: capacity_general_cargo
        description: "Estimated capacity of the general cargo ships (metric tons)."
      - name: capacity_roro
        description: "Estimated capacity of the RoRo vessels (metric tons)."
      - name: capacity_tanker
        description: "Estimated capacity of the tankers (metric tons)."
      - name: capacity_cargo
        description: "Estimated capacity of all cargo vessels, tankers excluded (metric tons)."
      - name: capacity
        description: "Estimated total capacity of all vessels (metric tons)."
      - name: ObjectId
        description: "Row number from the ArcGIS export. Not stable between downloads, not a key."
      - name: _row_id
        description: "Id of the stored staging row. Higher means a later version."
      - name: _loaded_at
        description: "UTC time of the load run that inserted the row."
      - name: _batch_id
        description: "Id (GUID) of the load run."
      - name: _source_file
        description: "CSV file the row came from."
      - name: _row_hash
        description: "SHA-256 of the row values, used by the loader to detect changes."

  # ----------------------------------------------------------------------
  - name: bronze_chokepoints
    description: >
      Reference table of chokepoints with location, vessel totals and top industries.
      Latest version of each portid from staging.portwatch_chokepoints, typed.
      Grain: one row per chokepoint.
    data_tests:
      - dbt_utils.expression_is_true:
          name: assert_chokepoint_lat_in_range
          arguments:
            expression: "lat between -90 and 90"
    columns:
      - name: X
        description: "Longitude in Web Mercator meters (EPSG:3857)."
      - name: Y
        description: "Latitude in Web Mercator meters (EPSG:3857)."
      - name: portid
        description: "Chokepoint identifier (e.g. chokepoint1)."
        data_tests: [not_null, unique]
      - name: portname
        description: "Chokepoint name."
      - name: country
        description: "Country. Empty for all chokepoints."
      - name: ISO3
        description: "ISO 3-letter country code. Empty for all chokepoints."
      - name: continent
        description: "Continent. Empty for all chokepoints."
      - name: fullname
        description: "Full display name of the chokepoint."
      - name: lat
        description: "Latitude in decimal degrees (WGS84)."
      - name: lon
        description: "Longitude in decimal degrees (WGS84)."
      - name: vessel_count_total
        description: "Total vessel count, all vessel types."
      - name: vessel_count_container
        description: "Vessel count, container ships."
      - name: vessel_count_dry_bulk
        description: "Vessel count, dry bulk carriers."
      - name: vessel_count_general_cargo
        description: "Vessel count, general cargo ships."
      - name: vessel_count_RoRo
        description: "Vessel count, RoRo vessels."
      - name: vessel_count_tanker
        description: "Vessel count, tankers."
      - name: industry_top1
        description: "Largest industry (trade category) served by the chokepoint."
      - name: industry_top2
        description: "Second largest industry."
      - name: industry_top3
        description: "Third largest industry."
      - name: share_country_maritime_import
        description: "Share of the country's maritime imports. Empty for all chokepoints."
      - name: share_country_maritime_export
        description: "Share of the country's maritime exports. Empty for all chokepoints."
      - name: LOCODE
        description: "UN/LOCODE. Empty for all chokepoints."
      - name: pageid
        description: "Id of the chokepoint page in the PortWatch portal."
      - name: countrynoaccents
        description: "Country name without accents. Empty for all chokepoints."
      - name: ObjectId
        description: "Row number from the ArcGIS export. Not a key."
      - name: _row_id
        description: "Id of the stored staging row. Higher means a later version."
      - name: _loaded_at
        description: "UTC time of the load run."
      - name: _batch_id
        description: "Id (GUID) of the load run."
      - name: _source_file
        description: "CSV file the row came from."
      - name: _row_hash
        description: "SHA-256 of the row values."

  # ----------------------------------------------------------------------
  - name: bronze_disruptions
    description: >
      Natural-disaster events that disrupted ports (2018-2026). Latest version of each
      eventid from staging.portwatch_disruptions, typed (dates converted from text
      M/D/YYYY h:mm:ss AM/PM). Grain: one row per event.
    data_tests:
      - dbt_utils.expression_is_true:
          name: assert_disruption_end_after_start
          arguments:
            expression: "todate >= fromdate"
          config:
            severity: warn
    columns:
      - name: eventid
        description: "Unique event identifier."
        data_tests: [not_null, unique]
      - name: eventtype
        description: "Event type code: TC cyclone, EQ earthquake, FL flood, DR drought, WF wildfire, VO volcano, OT other."
        data_tests:
          - accepted_values:
              arguments:
                values: ['TC', 'EQ', 'FL', 'DR', 'WF', 'VO', 'OT']
              config:
                severity: warn
      - name: eventname
        description: "Short event name (e.g. IDAI-19)."
      - name: htmlname
        description: "Display name with the event type."
      - name: htmldescription
        description: "Free-text description of the event, countries and dates."
      - name: alertlevel
        description: "Alert level (RED or ORANGE)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['RED', 'ORANGE']
              config:
                severity: warn
      - name: country
        description: "Affected countries, separated by semicolons."
      - name: fromdate
        description: "Event start, converted from text to DATETIME2."
        data_tests: [not_null]
      - name: year
        description: "Year of the event."
      - name: todate
        description: >
          Event end, converted from text to DATETIME2. NULL means the event is still
          ongoing (the source has no end date), e.g. Red Sea Tensions and HORMUZ-26.
      - name: severitytext
        description: "Description of the event severity."
      - name: lat
        description: "Latitude of the event centre in decimal degrees."
      - name: long
        description: "Longitude of the event centre in decimal degrees."
      - name: editdate
        description: "Last edit time of the event record, converted from text."
      - name: affectedports
        description: "Ids of the affected ports, separated by semicolons (e.g. port137; port784). Still text."
      - name: n_affectedports
        description: "Number of affected ports."
      - name: affectedpopulation
        description: "Affected population as free text. Parsed in a later layer."
      - name: pageid
        description: "Id of the event page in the PortWatch portal."
      - name: ObjectId
        description: "Row number from the ArcGIS export. Not a key."
      - name: Shape__Area
        description: "Area of the event footprint polygon (ArcGIS field)."
      - name: Shape__Length
        description: "Perimeter of the event footprint polygon (ArcGIS field)."
      - name: _row_id
        description: "Id of the stored staging row. Higher means a later version."
      - name: _loaded_at
        description: "UTC time of the load run."
      - name: _batch_id
        description: "Id (GUID) of the load run."
      - name: _source_file
        description: "CSV file the row came from."
      - name: _row_hash
        description: "SHA-256 of the row values."